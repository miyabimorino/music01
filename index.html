<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Complete 8bit Game BGM Editor</title>
    <style>
        body {
            background: #0b0b0b;
            color: #00ff88;
            font-family: monospace;
            margin: 20px
        }

        h2 {
            margin: 0 0 10px 0;
            color: #00ffaa
        }

        .controls {
            margin-bottom: 15px
        }

        button,
        select,
        input {
            background: #111;
            color: #00ff88;
            border: 1px solid #00aa66;
            padding: 6px 8px;
            margin-right: 6px;
            font-family: monospace
        }

        button:hover {
            background: #003322
        }

        #sequencer {
            display: flex;
            gap: 35px
        }

        .channel {
            display: flex;
            flex-direction: column
        }

        .channel-title {
            text-align: center;
            color: #00ffaa;
            margin-bottom: 4px
        }

        .step-header {
            display: flex;
            margin-left: 55px
        }

        .step-num {
            width: 16px;
            text-align: center;
            font-size: 10px;
            color: #00aa66
        }

        .row {
            display: flex
        }

        .label {
            width: 55px;
            font-size: 9px;
            text-align: right;
            padding-right: 6px;
            color: #007744
        }

        .cell {
            width: 16px;
            height: 10px;
            border: 1px solid #1a1a1a;
            cursor: pointer
        }

        .cell:hover {
            background: #003322
        }

        .white.active {
            background: #00ff88
        }

        .black.active {
            background: #009944
        }

        .tri.active {
            background: #88ffaa
        }

        .noise.active {
            background: #00ffff
        }

        .blackbg {
            background: #111
        }

        .octave-line {
            border-top: 1px solid #00aa55
        }

        .step-sep {
            border-right: 2px solid #003322
        }

        .playhead {
            outline: 1px solid #ffffff
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>
</head>

<body>

    <h2>Complete 8bit Game BGM Editor</h2>

    <div class="controls">

        BPM
        <input type="number" id="bpm" value="120" min="40" max="300">

        Steps
        <select id="stepCount">
            <option>16</option>
            <option>32</option>
            <option>64</option>
        </select>

        <button onclick="rebuild()">Apply</button>

        <button onclick="togglePlay()">Play</button>
        <button onclick="stop()">Stop</button>

        <button onclick="toggleLoop()" id="loopBtn">Loop OFF</button>

        <button onclick="resetSong()">Reset</button>

        <button onclick="saveJSON()">Save JSON</button>

        <input type="file" id="loadFile" style="display:none" onchange="loadJSON(event)">

        <button onclick="document.getElementById('loadFile').click()">
            Load JSON
        </button>

        <button onclick="exportMP3()">Export MP3</button>
    </div>

    <div id="sequencer"></div>

    <script>

        let steps = 16
        const octaves = 3
        const startOct = 3

        const notes = [
            "C", "C#", "D", "D#", "E",
            "F", "F#", "G", "G#", "A", "A#", "B"
        ]

        const totalNotes = octaves * 12

        let audioCtx = new (window.AudioContext || window.webkitAudioContext)()

        let data = []

        let playing = false
        let loop = false
        let step = 0
        let timer
        let drag = false

        function initData() {

            data = [
                Array(steps).fill(null),
                Array(steps).fill(null),
                Array(steps).fill(null),
                Array(steps).fill(false)
            ]

        }

        initData()

        function freq(i) {

            let octave = startOct + Math.floor(i / 12)
            let note = i % 12

            let A4 = 440

            let semitone = (octave - 4) * 12 + note - 9

            return A4 * Math.pow(2, semitone / 12)

        }

        function rebuild() {

            steps = parseInt(document.getElementById("stepCount").value)

            initData()

            build()

            draw()

        }

        function build() {

            const root = document.getElementById("sequencer")

            root.innerHTML = ""

            const chNames = [
                "Pulse1",
                "Pulse2",
                "Triangle",
                "Noise"
            ]

            for (let ch = 0; ch < 4; ch++) {

                let chDiv = document.createElement("div")
                chDiv.className = "channel"

                let title = document.createElement("div")
                title.className = "channel-title"
                title.innerText = chNames[ch]

                chDiv.appendChild(title)

                let header = document.createElement("div")
                header.className = "step-header"

                let spacer = document.createElement("div")
                spacer.style.width = "55px"

                header.appendChild(spacer)

                for (let s = 0; s < steps; s++) {

                    let n = document.createElement("div")

                    n.className = "step-num"
                    n.innerText = s + 1

                    header.appendChild(n)

                }

                chDiv.appendChild(header)

                if (ch < 3) {

                    for (let n = totalNotes - 1; n >= 0; n--) {

                        let row = document.createElement("div")
                        row.className = "row"

                        if (n % 12 === 0)
                            row.classList.add("octave-line")

                        let label = document.createElement("div")
                        label.className = "label"
                        label.style.pointerEvents="none"

                        if (n % 12 === 0)
                            label.innerText = notes[n % 12] + (startOct + Math.floor(n / 12))

                        row.appendChild(label)

                        for (let s = 0; s < steps; s++) {

                            let cell = document.createElement("div")

                            cell.className = "cell"

                            let name = notes[n % 12]

                            if (name.includes("#"))
                                cell.classList.add("blackbg", "black")
                            else
                                cell.classList.add("white")

                            if (ch == 2)
                                cell.classList.add("tri")

                            if ((s + 1) % 4 === 0)
                                cell.classList.add("step-sep")

                            cell.dataset.ch = ch
                            cell.dataset.step = s
                            cell.dataset.note = n

                            cell.onmousedown = e => { drag = true; toggleCell(ch, s, n) }
                            cell.onmouseover = e => { if (drag) toggleCell(ch, s, n) }

                            row.appendChild(cell)

                        }

                        chDiv.appendChild(row)

                    }

                } else {

                    let row = document.createElement("div")
                    row.className = "row"

                    let label = document.createElement("div")
                    label.className = "label"

                    label.innerText = "NOISE"

                    row.appendChild(label)

                    for (let s = 0; s < steps; s++) {

                        let cell = document.createElement("div")

                        cell.className = "cell noise"

                        if ((s + 1) % 4 === 0)
                            cell.classList.add("step-sep")

                        cell.dataset.step = s

                        cell.onmousedown = () => {
                            drag = true
                            data[3][s] = !data[3][s]
                            draw()
                        }

                        row.appendChild(cell)

                    }

                    chDiv.appendChild(row)

                }

                root.appendChild(chDiv)

            }

            document.body.onmouseup = () => drag = false

        }

        function toggleCell(ch, s, n) {

            if (data[ch][s] === n)
                data[ch][s] = null
            else
                data[ch][s] = n

            draw()

        }

        function draw() {

            document.querySelectorAll(".cell")
                .forEach(c => c.classList.remove("active", "playhead"))

            for (let ch = 0; ch < 4; ch++) {

                for (let s = 0; s < steps; s++) {

                    if (ch < 3) {

                        let n = data[ch][s]

                        if (n !== null) {

                            let cell = document.querySelector(
                                `.cell[data-ch="${ch}"][data-step="${s}"][data-note="${n}"]`
                            )

                            if (cell)
                                cell.classList.add("active")

                        }

                    } else {

                        if (data[3][s]) {

                            let cell = document.querySelector(
                                `.noise[data-step="${s}"]`
                            )

                            if (cell)
                                cell.classList.add("active")

                        }

                    }

                }

            }

            document.querySelectorAll(
                `.cell[data-step="${step}"]`
            ).forEach(c => c.classList.add("playhead"))

        }

        function playStep() {

            let bpm = parseInt(document.getElementById("bpm").value)

            let len = (60 / bpm) / 4

            draw()

            for (let ch = 0; ch < 3; ch++) {

                let n = data[ch][step]

                if (n !== null) {

                    let osc = audioCtx.createOscillator()
                    let gain = audioCtx.createGain()

                    osc.type = ch == 2 ? "triangle" : "square"

                    osc.frequency.value = freq(n)

                    gain.gain.value = 0.12

                    osc.connect(gain)
                    gain.connect(audioCtx.destination)

                    osc.start()
                    osc.stop(audioCtx.currentTime + len)

                }

            }

            if (data[3][step]) {

                let size = audioCtx.sampleRate * len

                let buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate)

                let out = buf.getChannelData(0)

                for (let i = 0; i < size; i++)
                    out[i] = Math.random() * 2 - 1

                let src = audioCtx.createBufferSource()

                src.buffer = buf

                let g = audioCtx.createGain()
                g.gain.value = 0.15

                src.connect(g)
                g.connect(audioCtx.destination)

                src.start()

            }

            step++

            if (step >= steps) {

                if (loop)
                    step = 0
                else
                    stop()

            }

        }

        function togglePlay() {

            if (playing) {

                stop()
                return

            }

            playing = true
            step = 0

            let bpm = parseInt(document.getElementById("bpm").value)

            let ms = (60 / bpm) / 4 * 1000

            timer = setInterval(playStep, ms)

        }

        function stop() {

            playing = false

            clearInterval(timer)

            step = 0

            draw()

        }

        function toggleLoop() {

            loop = !loop

            document.getElementById("loopBtn").innerText =
                "Loop " + (loop ? "ON" : "OFF")

        }

        function resetSong() {

            initData()

            draw()

        }

        function saveJSON() {

            const song = {
                bpm: parseInt(document.getElementById("bpm").value),
                steps: steps,
                channels: data
            }

            const blob = new Blob(
                [JSON.stringify(song, null, 2)],
                { type: "application/json" }
            )

            const a = document.createElement("a")

            a.href = URL.createObjectURL(blob)
            a.download = "bgm_song.json"
            a.click()
        }
        function loadJSON(e) {

            const file = e.target.files[0]

            if (!file) return

            const reader = new FileReader()

            reader.onload = function () {

                const song = JSON.parse(reader.result)

                document.getElementById("bpm").value = song.bpm

                steps = song.steps
                data = song.channels

                document.getElementById("stepCount").value = steps

                build()
                draw()

            }

            reader.readAsText(file)

        }

        async function exportMP3() {

            const bpm = parseInt(document.getElementById("bpm").value)

            const stepTime = (60 / bpm) / 4

            const length = steps * stepTime

            const sampleRate = 44100

            const offline = new OfflineAudioContext(
                1,
                sampleRate * length,
                sampleRate
            )

            for (let s = 0; s < steps; s++) {

                const t = s * stepTime

                for (let ch = 0; ch < 3; ch++) {

                    let n = data[ch][s]

                    if (n !== null) {

                        let osc = offline.createOscillator()
                        let g = offline.createGain()

                        osc.type = ch == 2 ? "triangle" : "square"
                        osc.frequency.value = freq(n)

                        g.gain.value = 0.15

                        osc.connect(g)
                        g.connect(offline.destination)

                        osc.start(t)
                        osc.stop(t + stepTime)

                    }

                }

                if (data[3][s]) {

                    let buffer = offline.createBuffer(
                        1,
                        sampleRate * stepTime,
                        sampleRate
                    )

                    let out = buffer.getChannelData(0)

                    for (let i = 0; i < out.length; i++)
                        out[i] = Math.random() * 2 - 1

                    let src = offline.createBufferSource()
                    src.buffer = buffer

                    let g = offline.createGain()
                    g.gain.value = 0.15

                    src.connect(g)
                    g.connect(offline.destination)

                    src.start(t)

                }

            }

            const rendered = await offline.startRendering()

            const samples = rendered.getChannelData(0)

            const mp3encoder = new lamejs.Mp3Encoder(1, 44100, 128)

            let mp3Data = []

            const block = 1152

            for (let i = 0; i < samples.length; i += block) {

                let slice = samples.subarray(i, i + block)

                let buf = new Int16Array(slice.length)

                for (let j = 0; j < slice.length; j++)
                    buf[j] = slice[j] * 32767

                let mp3buf = mp3encoder.encodeBuffer(buf)

                if (mp3buf.length > 0)
                    mp3Data.push(mp3buf)

            }

            let end = mp3encoder.flush()

            if (end.length > 0)
                mp3Data.push(end)

            const blob = new Blob(mp3Data, { type: "audio/mp3" })

            const a = document.createElement("a")

            a.href = URL.createObjectURL(blob)
            a.download = "bgm.mp3"
            a.click()

        }
        build()
        draw()


    </script>

</body>

</html>

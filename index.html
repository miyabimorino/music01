<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>8bit Sound Tool Final</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>

    <style>
        body {
            background: #0b0b0b;
            color: #00ff88;
            font-family: monospace;
            margin: 20px;
        }

        h2 {
            color: #00ffaa;
        }

        .controls {
            margin-bottom: 15px;
        }

        button,
        input,
        select {

            background: #111;
            color: #00ff88;
            border: 1px solid #00aa66;
            padding: 5px 8px;
            margin-right: 5px;
        }

        button:hover {
            background: #003322;
        }

        .channel {
            margin-bottom: 20px;
        }

        .header {
            display: grid;
            grid-template-columns: 60px repeat(var(--steps), 20px);
        }

        .step {
            text-align: center;
            font-size: 10px;
            color: #00aa66;
        }

        .row {
            display: grid;
            grid-template-columns: 60px repeat(var(--steps), 20px);
        }

        .label {
            font-size: 10px;
            text-align: right;
            padding-right: 6px;
            pointer-events: none;
        }

        .cell {

            width: 20px;
            height: 10px;

            border: 1px solid #1a1a1a;

            cursor: pointer;

        }

        .cell:hover {
            background: #003322;
        }

        .white.active {
            background: #00ff88;
        }

        .black.active {
            background: #009944;
        }

        .tri.active {
            background: #88ffaa;
        }

        .noise.active {
            background: #00ffff;
        }

        .blackbg {
            background: #111;
        }

        .playhead {
            outline: 1px solid white;
        }
    </style>
</head>

<body>

    <h2>8bit Game Sound Tool Final</h2>

    <div class="controls">

        BPM
        <input id="bpm" type="number" value="120">

        Steps
        <select id="stepSelect">
            <option>16</option>
            <option>32</option>
            <option>64</option>
        </select>

        <button onclick="rebuild()">Apply</button>

        <button onclick="play()">Play</button>
        <button onclick="stop()">Stop</button>

        <button onclick="toggleLoop()" id="loopBtn">Loop OFF</button>

        <button onclick="resetSong()">Reset</button>

        <button onclick="saveJSON()">Save JSON</button>

        <input type="file" id="loadFile" style="display:none" onchange="loadJSON(event)">

        <button onclick="loadFile.click()">Load JSON</button>

        <button onclick="exportMP3()">Export MP3</button>

    </div>

    <div id="editor"></div>

    <script>

        let steps = 16
        let data = []
        let loop = false
        let playing = false
        let step = 0
        let timer

        const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"]

        const octaves = 3
        const totalNotes = octaves * 12
        const startOct = 3

        const ctx = new AudioContext()

        function initData() {

            data = [
                Array(steps).fill(null),
                Array(steps).fill(null),
                Array(steps).fill(null),
                Array(steps).fill(false)
            ]

        }

        initData()

        function freq(n) {

            let octave = startOct + Math.floor(n / 12)
            let note = n % 12

            let A4 = 440
            let semitone = (octave - 4) * 12 + note - 9

            return A4 * Math.pow(2, semitone / 12)

        }

        function rebuild() {

            steps = parseInt(stepSelect.value)

            initData()

            build()

            draw()

        }

        function build() {

            editor.innerHTML = ""

            editor.style.setProperty("--steps", steps)

            const names = ["Pulse1", "Pulse2", "Triangle", "Noise"]

            for (let ch = 0; ch < 4; ch++) {

                let channel = document.createElement("div")
                channel.className = "channel"

                let title = document.createElement("div")
                title.textContent = names[ch]

                channel.appendChild(title)

                let header = document.createElement("div")
                header.className = "header"

                let blank = document.createElement("div")
                header.appendChild(blank)

                for (let s = 0; s < steps; s++) {

                    let h = document.createElement("div")
                    h.className = "step"
                    h.textContent = s + 1

                    header.appendChild(h)

                }

                channel.appendChild(header)

                if (ch < 3) {

                    for (let n = totalNotes - 1; n >= 0; n--) {

                        let row = document.createElement("div")
                        row.className = "row"

                        let label = document.createElement("div")
                        label.className = "label"

                        if (n % 12 == 0)
                            label.textContent = notes[n % 12] + (startOct + Math.floor(n / 12))

                        row.appendChild(label)

                        for (let s = 0; s < steps; s++) {

                            let cell = document.createElement("div")

                            cell.className = "cell"

                            let name = notes[n % 12]

                            if (name.includes("#"))
                                cell.classList.add("blackbg", "black")
                            else
                                cell.classList.add("white")

                            if (ch == 2)
                                cell.classList.add("tri")

                            cell.dataset.ch = ch
                            cell.dataset.step = s
                            cell.dataset.note = n

                            cell.onclick = () => {

                                if (data[ch][s] == n)
                                    data[ch][s] = null
                                else
                                    data[ch][s] = n

                                draw()

                            }

                            row.appendChild(cell)

                        }

                        channel.appendChild(row)

                    }

                } else {

                    let row = document.createElement("div")
                    row.className = "row"

                    let label = document.createElement("div")
                    label.className = "label"
                    label.textContent = "NOISE"

                    row.appendChild(label)

                    for (let s = 0; s < steps; s++) {

                        let cell = document.createElement("div")
                        cell.className = "cell noise"

                        cell.onclick = () => {

                            data[3][s] = !data[3][s]

                            draw()

                        }

                        row.appendChild(cell)

                    }

                    channel.appendChild(row)

                }

                editor.appendChild(channel)

            }

        }

        function draw() {

            document.querySelectorAll(".cell").forEach(c => {

                c.classList.remove("active", "playhead")

            })

            for (let ch = 0; ch < 4; ch++) {

                for (let s = 0; s < steps; s++) {

                    if (ch < 3) {

                        let n = data[ch][s]

                        if (n != null) {

                            let cell = document.querySelector(
                                `.cell[data-ch='${ch}'][data-step='${s}'][data-note='${n}']`
                            )

                            if (cell)
                                cell.classList.add("active")

                        }

                    } else {

                        if (data[3][s]) {

                            editor
                                .querySelectorAll(".noise")[s]
                                .classList.add("active")

                        }

                    }

                }

            }

            document.querySelectorAll(
                `.cell[data-step='${step}']`
            ).forEach(c => c.classList.add("playhead"))

        }

        function playStep() {

            const bpmEl = document.getElementById("bpm")
            let bpm = parseInt(bpmEl.value)

            let len = (60 / bpm) / 4

            draw()

            for (let ch = 0; ch < 3; ch++) {

                let n = data[ch][step]

                if (n != null) {

                    let osc = ctx.createOscillator()
                    let g = ctx.createGain()

                    osc.type = ch == 2 ? "triangle" : "square"

                    osc.frequency.value = freq(n)

                    g.gain.value = 0.12

                    osc.connect(g)
                    g.connect(ctx.destination)

                    osc.start()
                    osc.stop(ctx.currentTime + len)

                }

            }

            if (data[3][step]) {

                let buf = ctx.createBuffer(
                    1,
                    ctx.sampleRate * len,
                    ctx.sampleRate
                )

                let out = buf.getChannelData(0)

                for (let i = 0; i < out.length; i++)
                    out[i] = Math.random() * 2 - 1

                let src = ctx.createBufferSource()
                src.buffer = buf

                src.connect(ctx.destination)

                src.start()

            }

            step++

            if (step >= steps) {

                if (loop)
                    step = 0
                else
                    stop()

            }

        }

        function play() {

            if (playing) {
                stop()
                return
            }

            playing = true
            step = 0

            const bpmEl = document.getElementById("bpm")
            let bpmv = parseInt(bpmEl.value)

            timer = setInterval(
                playStep,
                (60 / bpmv) / 4 * 1000
            )

        }

        function stop() {

            playing = false
            clearInterval(timer)
            step = 0
            draw()

        }

        function toggleLoop() {

            loop = !loop

            loopBtn.textContent = "Loop " + (loop ? "ON" : "OFF")

        }

        function resetSong() {

            initData()
            draw()

        }

        function saveJSON() {

            let song = {

                bpm: parseInt(bpm.value),
                steps: steps,
                channels: data

            }

            let blob = new Blob(
                [JSON.stringify(song, null, 2)],
                { type: "application/json" }
            )

            let a = document.createElement("a")

            a.href = URL.createObjectURL(blob)
            a.download = "song.json"
            a.click()

        }

        function loadJSON(e) {

            const file = e.target.files[0]

            if (!file) return

            const reader = new FileReader()

            reader.onload = function () {

                const song = JSON.parse(reader.result)

                // BPM更新
                bpm.value = song.bpm ?? bpm.value

                // stepsは現在のUIを優先
                const gridSteps = parseInt(stepSelect.value)

                // 新しいデータ作成
                let newData = [
                    Array(gridSteps).fill(null),
                    Array(gridSteps).fill(null),
                    Array(gridSteps).fill(null),
                    Array(gridSteps).fill(false)
                ]

                // JSONチャンネル取得
                const src = song.channels ?? []

                for (let ch = 0; ch < 4; ch++) {

                    const srcRow = src[ch] ?? []

                    for (let s = 0; s < gridSteps; s++) {

                        if (s >= srcRow.length) continue

                        let v = srcRow[s]

                        if (ch < 3) {

                            if (v !== null && v !== undefined)
                                newData[ch][s] = v

                        } else {

                            newData[3][s] = !!v

                        }

                    }

                }

                // データ置換
                data = newData

                // グリッド再描画
                draw()

            }

            reader.readAsText(file)

        } async function exportMP3() {

            let bpmv = parseInt(bpm.value)

            let stepTime = (60 / bpmv) / 4

            let length = steps * stepTime

            let rate = 44100

            let offline = new OfflineAudioContext(
                1,
                rate * length,
                rate
            )

            for (let s = 0; s < steps; s++) {

                let t = s * stepTime

                for (let ch = 0; ch < 3; ch++) {

                    let n = data[ch][s]

                    if (n == null) continue

                    let osc = offline.createOscillator()

                    osc.type = ch == 2 ? "triangle" : "square"

                    osc.frequency.value = freq(n)

                    osc.connect(offline.destination)

                    osc.start(t)
                    osc.stop(t + stepTime)

                }

            }

            let rendered = await offline.startRendering()

            let samples = rendered.getChannelData(0)

            let mp3enc = new lamejs.Mp3Encoder(1, 44100, 128)

            let block = 1152

            let mp3 = []

            for (let i = 0; i < samples.length; i += block) {

                let slice = samples.subarray(i, i + block)

                let buf = new Int16Array(slice.length)

                for (let j = 0; j < slice.length; j++)
                    buf[j] = slice[j] * 32767

                let d = mp3enc.encodeBuffer(buf)

                if (d.length > 0)
                    mp3.push(d)

            }

            let end = mp3enc.flush()

            if (end.length > 0)
                mp3.push(end)

            let blob = new Blob(mp3, { type: "audio/mp3" })

            let a = document.createElement("a")

            a.href = URL.createObjectURL(blob)
            a.download = "bgm.mp3"
            a.click()

        }

        build()
        draw()

    </script>

</body>

</html>
